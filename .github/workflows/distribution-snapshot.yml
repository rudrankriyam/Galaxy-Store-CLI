name: Distribution snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "README.md"
      - "Formula/gsc.rb"
      - ".goreleaser.yaml"
      - ".github/workflows/distribution-snapshot.yml"
      - ".github/workflows/draft-release.yml"
      - ".github/workflows/winget-snapshot.yml"
      - "tests/test_distribution_workflows.py"
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "README.md"
      - "Formula/gsc.rb"
      - ".goreleaser.yaml"
      - ".github/workflows/distribution-snapshot.yml"
      - ".github/workflows/draft-release.yml"
      - ".github/workflows/winget-snapshot.yml"
      - "tests/test_distribution_workflows.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archives:
    name: Build archives, checksums, and SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test distribution workflow contracts
        run: python3 -m unittest -v tests/test_distribution_workflows.py

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Build non-publishing snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Verify artifact inventory and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test -f dist/artifacts.json
          test -f dist/metadata.json
          test "$(find dist -maxdepth 1 -type f -name 'gsc_*_darwin_*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name 'gsc_*_linux_*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name 'gsc_*_windows_*.zip' | wc -l)" -eq 2
          test "$(jq '[.[] | select(.type == "SBOM")] | length' dist/artifacts.json)" -eq 6
          jq -e '
            ([.[] | select(.type == "Archive") | [.goos, .goarch]] | sort)
            ==
            ([
              ["darwin", "amd64"],
              ["darwin", "arm64"],
              ["linux", "amd64"],
              ["linux", "arm64"],
              ["windows", "amd64"],
              ["windows", "arm64"]
            ] | sort)
          ' dist/artifacts.json >/dev/null

          snapshot_version="$(jq -r '.version' dist/metadata.json)"
          test -n "$snapshot_version"
          test "$snapshot_version" != "null"

          for archive in dist/gsc_*_darwin_*.tar.gz dist/gsc_*_linux_*.tar.gz; do
            test "$(tar -tzf "$archive" | sort | tr '\n' ' ')" = "LICENSE README.md gsc "
            [[ "$(basename "$archive")" == *"_${snapshot_version}_"* ]]
          done
          for archive in dist/gsc_*_windows_*.zip; do
            test "$(unzip -Z1 "$archive" | sort | tr '\n' ' ')" = "LICENSE README.md gsc.exe "
            [[ "$(basename "$archive")" == *"_${snapshot_version}_"* ]]
          done

          cd dist
          sha256sum --check checksums.txt

      - name: Upload ephemeral snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gsc-distribution-snapshot-${{ github.sha }}
          path: dist/
          retention-days: 7

  homebrew:
    name: Install and test Homebrew HEAD formula
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate formula style
        run: brew style Formula/gsc.rb

      - name: Prepare an isolated local tap
        run: |
          brew tap-new --no-git rudrankriyam/gsc-snapshot
          cp Formula/gsc.rb \
            "$(brew --repository rudrankriyam/gsc-snapshot)/Formula/gsc.rb"

      - name: Install from the HEAD formula
        run: brew install --HEAD rudrankriyam/gsc-snapshot/gsc

      - name: Test the installed command
        run: |
          brew test rudrankriyam/gsc-snapshot/gsc
          gsc --help
          gsc version

      - name: Verify workflow cannot publish
        if: always()
        shell: bash
        run: |
          test "${GITHUB_TOKEN:-}" = ""
          forbidden=(
            "gh rel""ease"
            "git t""ag"
            "git p""ush"
            "wingetcreate sub""mit"
          )
          for needle in "${forbidden[@]}"; do
            if grep -Fq "${needle}" .github/workflows/distribution-snapshot.yml; then
              echo "::error::Publishing operation found: ${needle}"
              exit 1
            fi
          done
