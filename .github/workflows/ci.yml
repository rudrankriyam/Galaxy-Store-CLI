name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint tools
        run: make tools

      - name: Check formatting
        run: make format-check

      - name: Check command reference
        run: make docs-check

      - name: Run go vet
        run: make vet

      - name: Run linters
        run: make lint

      - name: Run tests
        run: make test

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with the race detector
        run: make test-race

  build:
    name: Build and smoke test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            binary: build/gsc
          - name: macOS
            runner: macos-latest
            binary: build/gsc
          - name: Windows
            runner: windows-latest
            binary: build/gsc.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        run: |
          mkdir -p build
          go build -trimpath -o "${{ matrix.binary }}" .

      - name: Smoke test
        shell: bash
        run: '"${{ matrix.binary }}" version'
